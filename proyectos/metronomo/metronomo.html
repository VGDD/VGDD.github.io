<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">

		<!-- Always force latest IE rendering engine (even in intranet) & Chrome Frame
		Remove this if you use the .htaccess -->
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">

		<title>Víctor González de Diego</title>

		<meta name="description" content="">
		<meta name="author" content="Víctor González">

		<meta name="viewport" content="width=device-width; initial-scale=1.0">

		<!-- Replace favicon.ico & apple-touch-icon.png in the root of your domain and delete these references -->
		<link rel="shortcut icon" href="/favicon.ico">
		<link rel="apple-touch-icon" href="/apple-touch-icon.png">

		<!-- FONTS -->
		<link href='https://fonts.googleapis.com/css?family=Montserrat:400,700' rel='stylesheet' type='text/css'>

		<!-- CSS -->
		<link href="../../css/vgd.css" rel="stylesheet" />
		<link href="metronomo-css/metronomo.css" rel="stylesheet" />
        
		<!-- JS -->
		<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
      

        
	</head>

	<body ontouchstart="">
		<div id="container">
            
			<header id="cabecera" class="cabecera contenido-centrado">
				<h1>Metronomo</h1>
			</header>
			<div id="contenido">
                  <section class="metronome-container">
    <div class="counter"></div>
    
    <i class="fa fa-cog options-btn"></i>

    <div class="controls">
     <div id="bpm-display">0 BPM</div>
        <div>
        <input type="range" min="40" max="200" value="60" class="bpm-input" /> 
        </div>
        <!--<label>BPM: <span>
                    <i class="fa fa-minus bpm-minus"></i>
                    
                    <i class="fa fa-plus bpm-plus"></i>
        
                  </span>
      </label>-->
       
      <button class="play-btn">Play</button>
        
        <h2>Canciones</h2>
    <button class="tap-btn">Song 2</button>
    </div>
    
    <div class="options">
      <label>
        Beat: <input type="text" value="4" class="ts-top" /></label>
      <div style="margin-bottom: 15px;">
        <input type="checkbox" id="timer-check" />
        <label for="timer-check"></label>
        
        Timer: <input type="text" value="60" class="timer" />
      </div>
      <i class="fa fa-caret-down up"></i>
      <label>Off Beat Pitch: <input type="range" min="0" max="500" value="200" class="beat-range" /></label>
      <label>Accent Pitch: <input type="range" min="0" max="500" value="380" class="accent-range" /></label>
    </div>
  </section>
            </div>


			</div>
			        
		</div>

			<footer>
				<p>
					&copy; vgd
				</p>
			</footer>
            
    
    
    <!-- JS -->
		<script src="metronomo-js/metronomo.js"></script>
    
	</body>

</html>
</script>
</html>
